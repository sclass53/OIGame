            function initNormalDigGrid() {
                digGridCells = [];
                digGridRevealed = [];
                digCellStructureMap = [];
                digStructureGroups = [];
                for (let r = 0; r < DIG_ROWS; r++) {
                    digGridCells[r] = [];
                    digGridRevealed[r] = [];
                    digCellStructureMap[r] = [];
                    for (let c = 0; c < DIG_COLS; c++) {
                        digGridCells[r][c] = 'empty';
                        digGridRevealed[r][c] = false;
                        digCellStructureMap[r][c] = -1;
                    }
                }
                // 在普通挖掘场中散布多种结构
                const structDefs = [
                    { type: 'time_extend', name: '⏰时间扩展', size: 3, count: 3, effectDesc: '+3时间/场' },
                    { type: 'mind_box', name: '🧠思维块', size: 4, count: 3, effectDesc: '+1思维' },
                    { type: 'rare_boost', name: '💠稀有提升', size: 3, count: 2, effectDesc: '+0.5稀有奖励' },
                    { type: 'fail_safe', name: '🛡️失败保护', size: 4, count: 2, effectDesc: '一次保护' },
                    { type: 'inspire', name: '⚡振奋结构', size: 3, count: 2, effectDesc: '+1振奋' },
                ];
                let structIdx = 0;
                const usedCells = new Set();
                usedCells.add('0,0'); // 起点
                digGridRevealed[0][0] = true;
                digGridCells[0][0] = 'empty';

                structDefs.forEach(def => {
                    for (let ci = 0; ci < def.count; ci++) {
                        let attempts = 0;
                        let placed = false;
                        while (attempts < 200 && !placed) {
                            attempts++;
                            const startR = randomInt(0, DIG_ROWS - 3);
                            const startC = randomInt(0, DIG_COLS - 3);
                            // 生成形状
                            const shapeCells = [];
                            const sr = startR;
                            const sc = startC;
                            if (def.size === 3) {
                                // L形或直线
                                if (Math.random() < 0.5) {
                                    shapeCells.push({ r: sr, c: sc }, { r: sr, c: sc + 1 }, { r: sr + 1, c: sc });
                                } else {
                                    shapeCells.push({ r: sr, c: sc }, { r: sr + 1, c: sc }, { r: sr + 1, c: sc + 1 });
                                }
                            } else if (def.size === 4) {
                                shapeCells.push({ r: sr, c: sc }, { r: sr, c: sc + 1 }, { r: sr + 1, c: sc }, { r: sr + 1,
                                    c: sc + 1 });
                            }
                            const allValid = shapeCells.every(cell =>
                                cell.r >= 0 && cell.r < DIG_ROWS && cell.c >= 0 && cell.c < DIG_COLS &&
                                !usedCells.has(cell.r + ',' + cell.c) && digGridCells[cell.r][cell.c] === 'empty'
                            );
                            if (allValid) {
                                shapeCells.forEach(cell => usedCells.add(cell.r + ',' + cell.c));
                                digStructureGroups.push({
                                    id: structIdx,
                                    type: def.type,
                                    name: def.name,
                                    cells: shapeCells,
                                    allRevealed: false,
                                    effectApplied: false,
                                    effectDesc: def.effectDesc
                                });
                                shapeCells.forEach(cell => {
                                    digGridCells[cell.r][cell.c] = def.type;
                                    digCellStructureMap[cell.r][cell.c] = structIdx;
                                });
                                structIdx++;
                                placed = true;
                            }
                        }
                    }
                });
                digViewportTransform = { x: 0, y: 0 };
            }

            function getUnrevealedCount() {
                let count = 0;
                for (let r = 0; r < DIG_ROWS; r++)
                    for (let c = 0; c < DIG_COLS; c++)
                        if (!digGridRevealed[r][c]) count++;
                return count;
            }

            function handleDigClick(r, c, cellEl) {
                if (digGridRevealed[r][c]) return;
                if (skillPoints < 1) {
                    setDigMessage('⚠️ 技能点不足！需要1点技能点来挖掘。请先完成更多地图来获取技能点。', 'warning', 6000);
                    return;
                }
                const dirs = [
                    [-1, 0],
                    [1, 0],
                    [0, -1],
                    [0, 1]
                ];
                let hasAdjacentRevealed = false;
                for (const [dr, dc] of dirs) {
                    const nr = r + dr;
                    const nc = c + dc;
                    if (nr >= 0 && nr < DIG_ROWS && nc >= 0 && nc < DIG_COLS && digGridRevealed[nr][nc]) {
                        hasAdjacentRevealed = true;
                        break;
                    }
                }
                if (!hasAdjacentRevealed) {
                    setDigMessage('⚠️ 只能挖掘已探索方块相邻的格子！请从已揭示的区域向外扩展。', 'warning', 5000);
                    return;
                }
                const savedTransform = { x: digViewportTransform.x, y: digViewportTransform.y };
                skillPoints -= 1;
                digGridRevealed[r][c] = true;
                const content = digGridCells[r][c];
                const structIdx = digCellStructureMap[r][c];
                let structCompleted = false;
                let structType = null;
                if (structIdx >= 0) {
                    const struct = digStructureGroups[structIdx];
                    if (!struct.effectApplied && struct.cells.every(cell => digGridRevealed[cell.r][cell.c])) {
                        struct.effectApplied = true;
                        struct.allRevealed = true;
                        structCompleted = true;
                        structType = struct.type;
                        if (struct.type === 'time_extend') {
                            timeBonusPerMap += 3;
                            if (tutorialActive) tutorialDigStructRevealed = true;
                            setDigMessage('⏰ 时间扩展结构完全揭示！每场比赛初始时间+3（当前累计+' + timeBonusPerMap +
                                '）。这意味着以后的每场比赛你都会有更多的时间来探索！', 'success', 8000);
                        } else if (struct.type === 'mind_box') {
                            globalMind += 1;
                            setDigMessage('🧠 思维块结构完全揭示！思维永久+1（当前思维：' + globalMind +
                                '）。更高的思维意味着解锁节点时消耗更少的精力！', 'success', 8000);
                        } else if (struct.type === 'rare_boost') {
                            rareNodeBonus += 0.5;
                            setDigMessage('💠 稀有提升结构完全揭示！稀有节点奖励+0.5（当前累计+' + rareNodeBonus.toFixed(1) +
                                '）。检查特殊奖励节点时将获得更多技能点！', 'success', 8000);
                        } else if (struct.type === 'fail_safe') {
                            failSafeAvailable = true;
                            failSafeUsed = false;
                            setDigMessage('🛡️ 失败保护结构完全揭示！获得一次失败保护。当你在比赛中即将失败时，会自动触发保护。', 'success',
                                8000);
                        } else if (struct.type === 'inspire') {
                            inspireStructuresRevealed += 1;
                            setDigMessage('⚡ 振奋结构完全揭示！振奋层数+1（当前：' + inspireStructuresRevealed +
                                '）。振奋层数会影响奖励倍数。', 'success', 8000);
                        }
                        if (tutorialActive && !tutorialDigStructRevealed && struct.type !== 'time_extend') {
                            tutorialDigOtherStructRevealed[struct.type] = true;
                            setDigMessage(struct.name + ' 结构已揭示！在完整游戏中还有更多结构等待探索。请继续挖掘⏰时间扩展结构来完成教程目标。',
                                'info', 7000);
                        }
                    }
                }
                updateActiveSkillsBar();
                updateMindDisplay();
                const digSpEl = document.getElementById('digSkillPoints');
                const digMindEl = document.getElementById('digMindDisplay');
                if (digSpEl) digSpEl.textContent = formatSkillPoints(skillPoints);
                if (digMindEl) digMindEl.textContent = globalMind;
                updateDigBonusInfo();
                renderDigGrid(true);
                digViewportTransform = savedTransform;
                const viewport = document.getElementById('digViewport');
                if (viewport) {
                    viewport.style.transform = `translate(${savedTransform.x}px, ${savedTransform.y}px)`;
                }
                const remainingHintEl = document.getElementById('digRemainingHint');
                if (remainingHintEl) {
                    const unrevealed = getUnrevealedCount();
                    remainingHintEl.textContent = '剩余未挖掘方块：' + unrevealed + ' / ' + (DIG_ROWS * DIG_COLS) +
                        ' | 已揭示结构：' + digStructureGroups.filter(s => s.allRevealed).length + ' / ' + digStructureGroups
                        .length;
                }
                if (tutorialActive && !tutorialDigStructRevealed && !structCompleted) {
                    const teStruct = digStructureGroups.find(s => s.type === 'time_extend' && !s.allRevealed);
                    if (teStruct) {
                        const remaining = teStruct.cells.filter(cell => !digGridRevealed[cell.r][cell.c]).length;
                        setDigMessage('💡 继续挖掘相邻的⏰标记方块来完成时间扩展结构！还需' + remaining + '个格子。', 'info', 4000);
                    }
                }
                // 检查教程挖掘场中时间扩展是否完成
                if (tutorialActive && tutorialDigStructRevealed && !structCompleted) {
                    const closeBtn = document.getElementById('btnCloseDig');
                    if (closeBtn && closeBtn.textContent.indexOf('完成教程') === -1) {
                        closeBtn.textContent = '▶ 完成教程，开始CSP-S模拟赛练习';
                        closeBtn.style.background = '#4a9a3f';
                        closeBtn.style.color = '#fff';
                        updateTutorialGuide(7,
                            '🎉 太棒了！时间扩展结构已完全揭示！以后每场比赛初始时间都会+3。挖掘场中还有更多结构等待探索：思维块(+1思维)、稀有提升(+技能点奖励)、失败保护等。现在请点击下方按钮进入CSP-S模拟赛练习！',
                            '💡 练习赛中你可以自由探索完整的游戏机制，共有4张地图等你挑战。');
                    }
                }
            }

            function renderDigGrid(keepTransform) {
                const gridEl = document.getElementById('digGrid');
                const viewport = document.getElementById('digViewport');
                if (!gridEl) return;
                gridEl.style.gridTemplateColumns = `repeat(${DIG_COLS}, 50px)`;
                gridEl.style.gridTemplateRows = `repeat(${DIG_ROWS}, 50px)`;
                gridEl.innerHTML = '';
                for (let r = 0; r < DIG_ROWS; r++) {
                    for (let c = 0; c < DIG_COLS; c++) {
                        const cell = document.createElement('div');

                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        if (digGridRevealed[r][c]) {
                            cell.classList.add('revealed');

                                cell.classList.add('reward-time-extend');
                                cell.textContent = '⏰';
                            } else if (content === 'mind_box') {
                                cell.classList.add('reward-mind-box');
                                cell.textContent = '🧠';
                            } else if (content === 'rare_boost') {
                                cell.classList.add('reward-rare-boost');
                                cell.textContent = '💠';
                            } else if (content === 'fail_safe') {
                                cell.classList.add('reward-fail-safe');
                                cell.textContent = '🛡️';
                            } else if (content === 'inspire') {
                                cell.classList.add('reward-inspire');
                                cell.textContent = '⚡';
                            } else if (content === 'empty') {
                                cell.classList.add('reward-empty');
                                cell.textContent = '·';
                            } else {
                                cell.textContent = content;
                            }
                        } else {
                            cell.classList.add('unrevealed');
                            cell.textContent = '?';
                            cell.addEventListener('click', () => handleDigClick(r, c, cell));
                        }
                        gridEl.appendChild(cell);

                if (viewport && !keepTransform) {
                    digViewportTransform = { x: 0, y: 0 };

            function initDigDrag() {
                const viewport = document.getElementById('digViewport');
                if (!viewport) return;
                removeDigDrag();
                viewport.addEventListener('mousedown', onDigDragStart);
                viewport.addEventListener('touchstart', onDigDragStart, { passive: false });
                window.addEventListener('mousemove', onDigDragMove);
                window.addEventListener('touchmove', onDigDragMove, { passive: false });
                window.addEventListener('mouseup', onDigDragEnd);
                window.addEventListener('touchend', onDigDragEnd);
            }

            function removeDigDrag() {
                const viewport = document.getElementById('digViewport');
                if (viewport) {
                    viewport.removeEventListener('mousedown', onDigDragStart);
                    viewport.removeEventListener('touchstart', onDigDragStart);
                }
                window.removeEventListener('mousemove', onDigDragMove);
                window.removeEventListener('touchmove', onDigDragMove);
                window.removeEventListener('mouseup', onDigDragEnd);
                window.removeEventListener('touchend', onDigDragEnd);
            }

            function onDigDragStart(e) {
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                digDragStart = { x: clientX - digViewportTransform.x, y: clientY - digViewportTransform.y };
                const viewport = document.getElementById('digViewport');
                if (viewport) viewport.classList.add('dragging');
            }

            function onDigDragMove(e) {
                if (!digDragStart) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - digDragStart.x;
                const dy = clientY - digDragStart.y;
                const maxX = 0;
                const minX = Math.min(0, 500 - DIG_COLS * 50);
                const maxY = 0;
                const minY = Math.min(0, 500 - DIG_ROWS * 50);
                digViewportTransform.x = Math.max(minX, Math.min(maxX, dx));
                digViewportTransform.y = Math.max(minY, Math.min(maxY, dy));
                const viewport = document.getElementById('digViewport');
                if (viewport) viewport.style.transform =
                    `translate(${digViewportTransform.x}px, ${digViewportTransform.y}px)`;
            }

            function onDigDragEnd(e) {
                if (!digDragStart) return;
                digDragStart = null;
                const viewport = document.getElementById('digViewport');
                if (viewport) viewport.classList.remove('dragging');
            }

            function createTutorialMap() {
                const nodeMap = {};
                const R = { id: 'R', name: 'R', type: 'process', isCorrectPath: true, children: [], parent: null, level: 0,
                    reqValue: 0, score: null, state: 'hidden', x: 0, y: 0, isFork: false, _bounds: null, _checkBounds: null };
                const A = { id: 'A', name: 'A', type: 'important', isCorrectPath: false, children: [], parent: null, level: 1,
                    reqValue: 1, score: null, state: 'hidden', x: 0, y: 0, isFork: true, _bounds: null, _checkBounds: null };
                const B = { id: 'B', name: 'B', type: 'important', isCorrectPath: true, children: [], parent: null, level: 1,
                    reqValue: 1, score: null, state: 'hidden', x: 0, y: 0, isFork: true, _bounds: null, _checkBounds: null };
                const A1 = { id: 'A1', name: 'A1', type: 'result', isCorrectPath: false, children: [], parent: null, level: 2,
                    reqValue: 1, score: 70, state: 'hidden', x: 0, y: 0, isFork: false, _bounds: null, _checkBounds: null };
                const A2 = { id: 'A2', name: 'A2', type: 'result', isCorrectPath: false, children: [], parent: null, level: 2,
                    reqValue: 1, score: 60, state: 'hidden', x: 0, y: 0, isFork: false, _bounds: null, _checkBounds: null };
                const B1 = { id: 'B1', name: 'B1', type: 'result', isCorrectPath: true, children: [], parent: null, level: 2,
                    reqValue: 2, score: 100, state: 'hidden', x: 0, y: 0, isFork: false, _bounds: null, _checkBounds: null };
                const B2 = { id: 'B2', name: 'B2', type: 'result', isCorrectPath: false, children: [], parent: null, level: 2,
                    reqValue: 1, score: 40, state: 'hidden', x: 0, y: 0, isFork: false, _bounds: null, _checkBounds: null };
                R.children = [A, B];
                A.parent = R;
                B.parent = R;
                A.children = [A1, A2];
                A1.parent = A;
                A2.parent = A;
                B.children = [B1, B2];
                B1.parent = B;

                const allNodes = [R, A, B, A1, A2, B1, B2];
                allNodes.forEach(n => { nodeMap[n.id] = n; });
                const root = nodeMap['R'];
                const levelHeight = LOGICAL_HEIGHT / 4;

                A2.y = A.y + levelHeight;

                B1.y = B.y + levelHeight;

            function generateRandomTreeData(minCorrectDepth, seedOffset) {
                const baseNodes = 10 + (seedOffset % 4);
                const targetNodes = randomInt(baseNodes, baseNodes + 6);
                let idCounter = 0;

                function newId() { return 'N' + (idCounter++); }
                const root = {
                    id: 'R',
                    name: 'R',
                    type: 'process',
                    isCorrectPath: false,
                    children: [],
                    parent: null,
                    level: 0,
                    reqValue: randomInt(0, 1),
                    score: null
                };
                const allNodes = [root];
                const expandable = [root];

                function getMaxChildrenForType(type) {
                    if (type === 'important') return 2;
                    if (type === 'result') return 0;
                    return 3;
                }
                let safetyCounter = 0;
                const maxIterations = targetNodes * 5;
                while (allNodes.length < targetNodes && safetyCounter < maxIterations) {
                    safetyCounter++;
                    let candidates = expandable.filter(p => p.children.length < getMaxChildrenForType(p.type));
                    if (candidates.length === 0) {
                        candidates = allNodes.filter(n => n.type !== 'result' && n.children.length < getMaxChildrenForType(
                            n.type));
                    }
                    if (candidates.length === 0) {
                        const np = {
                            id: newId(),
                            name: newId(),
                            type: 'process',
                            isCorrectPath: false,
                            children: [],
                            parent: root,
                            level: 1,
                            reqValue: randomInt(0, 2),
                            score: null
                        };
                        root.children.push(np);
                        allNodes.push(np);
                        expandable.push(np);
                        candidates = [np];
                    }
                    const idx = randomInt(0, candidates.length - 1);
                    const parent = candidates[idx];
                    const remaining = targetNodes - allNodes.length;
                    const maxChildren = getMaxChildrenForType(parent.type);
                    const availableSlots = maxChildren - parent.children.length;
                    const maxToAdd = Math.min(2, remaining);
                    const childCount = Math.min(availableSlots, randomInt(1, Math.max(1, maxToAdd)));
                    for (let i = 0; i < childCount; i++) {
                        if (allNodes.length >= targetNodes) break;
                        const childLevel = (parent.level || 0) + 1;
                        const randVal = Math.random();
                        let childType;
                        if (randVal < 0.2) childType = 'important';
                        else if (randVal < 0.7) childType = 'process';
                        else childType = 'result';
                        const child = {
                            id: newId(),
                            name: newId(),
                            type: childType,
                            isCorrectPath: false,
                            children: [],
                            parent,
                            level: childLevel,
                            reqValue: randomInt(0, childLevel + 1),
                            score: null
                        };
                        allNodes.push(child);
                        parent.children.push(child);
                        if (childType !== 'result') expandable.push(child);
                    }
                    const idxInExpandable = expandable.indexOf(parent);
                    if (idxInExpandable >= 0 && parent.children.length >= getMaxChildrenForType(parent.type)) {
                        expandable.splice(idxInExpandable, 1);
                    }
                }
                let resultLeaves = allNodes.filter(n => n.type === 'result');
                if (resultLeaves.length === 0) {
                    let some = allNodes.find(n => n.type === 'process' && n.children.length < getMaxChildrenForType(n
                        .type)) || allNodes[allNodes.length - 1];
                    if (some && some.type === 'result') some.type = 'process';
                    if (some) {
                        const childLevel = (some.level || 0) + 1;
                        const res = {
                            id: newId(),
                            name: newId(),
                            type: 'result',
                            isCorrectPath: false,
                            children: [],
                            parent: some,
                            level: childLevel,
                            reqValue: randomInt(0, childLevel + 1),
                            score: null
                        };
                        some.children.push(res);
                        allNodes.push(res);
                        resultLeaves.push(res);
                    }
                }
                let deepResults = resultLeaves.filter(n => (n.level || 0) >= minCorrectDepth);
                if (deepResults.length === 0 && resultLeaves.length > 0) {
                    let deepest = resultLeaves.reduce((a, b) => ((a.level || 0) > (b.level || 0) ? a : b));
                    let safetyCount = 0;
                    while ((deepest.level || 0) < minCorrectDepth && safetyCount < 20) {
                        safetyCount++;
                        const childLevel = (deepest.level || 0) + 1;
                        const newChild = {
                            id: newId(),
                            name: newId(),
                            type: 'result',
                            isCorrectPath: false,
                            children: [],
                            parent: deepest,
                            level: childLevel,
                            reqValue: randomInt(0, childLevel + 1),
                            score: null
                        };
                        deepest.children.push(newChild);
                        allNodes.push(newChild);
                        deepest = newChild;
                        resultLeaves.push(newChild);
                    }
                    deepResults = [deepest];
                }
                if (deepResults.length === 0) {
                    deepResults = resultLeaves.length > 0 ? [resultLeaves[resultLeaves.length - 1]] : [allNodes[allNodes
                        .length - 1]];
                    if (deepResults[0] && deepResults[0].type !== 'result') {
                        deepResults[0].type = 'result';
                        deepResults[0].score = 100;
                    }
                }
                const correctResult = deepResults[randomInt(0, deepResults.length - 1)];
                resultLeaves.forEach(rn => {
                    if (rn === correctResult) {
                        rn.score = 100;
                    } else {
                        const lca = findLCA(rn, correctResult);
                        const distance = (rn.level || 0) + (correctResult.level || 0) - 2 * (lca ? (lca.level || 0) :
                            0);
                        const randomScore = Math.floor(Math.random() * 100 / 5) * 5;
                        rn.score = Math.min(randomScore, Math.floor(85 - Math.sqrt(Math.max(0, distance)) * 12));
                        rn.score = Math.max(5, rn.score || 5);
                    }
                });
                let cur = correctResult;
                while (cur) {
                    cur.isCorrectPath = true;
                    cur = cur.parent;
                }
                const nodeDefs = allNodes.map(n => ({
                    id: n.id,
                    name: n.name,
                    type: n.type,
                    isCorrectPath: n.isCorrectPath,
                    childIds: (n.children || []).map(c => c.id),
                    reqValue: n.reqValue,
                    score: n.score,
                    level: n.level
                }));
                const skillCandidates = resultLeaves.filter(n => n !== correctResult && (n.score || 0) >= 30);
                if (skillCandidates.length > 0) {
                    const skillNode = skillCandidates[randomInt(0, skillCandidates.length - 1)];
                    skillNode.type = 'skill';
                    skillNode.name = '💎' + skillNode.name;
                    const defEntry = nodeDefs.find(d => d.id === skillNode.id);
                    if (defEntry) {
                        defEntry.type = 'skill';
                        defEntry.name = '💎' + defEntry.name.replace('💎', '');
                    }
                }
                return { nodeDefs, correctResultId: correctResult.id };
            }

            function findLCA(a, b) {
                const path = new Set();
                let cur = a;
                while (cur) {
                    path.add(cur);
                    cur = cur.parent;
                }
                cur = b;
                while (cur) {
                    if (path.has(cur)) return cur;
                    cur = cur.parent;
                }
                return null;
            }

            function buildMapFromDefs(data) {
                const { nodeDefs, correctResultId } = data;
                const nodeMap = {};
                nodeDefs.forEach(d => nodeMap[d.id] = {
                    ...d,
                    children: [],
                    parent: null,
                    state: 'hidden',
                    x: 0,
                    y: 0,
                    isFork: false,
                    _bounds: null,
                    _checkBounds: null
                });
                Object.values(nodeMap).forEach(n => {
                    (n.childIds || []).forEach(cid => {
                        const c = nodeMap[cid];
                        if (c) {
                            n.children.push(c);
                            c.parent = n;
                        }
                    });
                    if (n.type === 'process' && n.children.length > 1) n.isFork = true;
                });
                const root = nodeMap['R'];
                if (root) {
                    Object.values(nodeMap).forEach(n => n.state = 'hidden');
                    root.state = 'visible_locked';
                }
                computeLayoutFromNodeMap(nodeMap, root);
                return {
                    nodeMap,
                    root,
                    correctResult: nodeMap[correctResultId] || null,
                    totalUnlocked: 0,
                    gameOver: false,
                    gameResult: null,
                    maxResultScore: 0,
                    hasSkillNode: !!Object.values(nodeMap).find(n => n.type === 'skill'),
                    skillNodeId: (Object.values(nodeMap).find(n => n.type === 'skill') || {}).id || null,
                    totalStaminaSpent: 0
                };
            }

            function computeLayoutFromNodeMap(nodeMap, root) {
                if (!root || !nodeMap) return;
                const levels = {};
                const nodeLevel = {};

                function assignLevel(n, lv) {
                    if (!n) return;
                    nodeLevel[n.id] = lv;
                    n.level = lv;
                    if (!levels[lv]) levels[lv] = [];
                    levels[lv].push(n);
                    if (n.children) {
                        n.children.forEach(c => assignLevel(c, lv + 1));
                    }
                }
                assignLevel(root, 0);
                const levelKeys = Object.keys(levels).map(Number);
                const maxLevel = levelKeys.length > 0 ? Math.max(...levelKeys) : 0;
                const levelHeight = LOGICAL_HEIGHT / (maxLevel + 2);
                const topMargin = levelHeight * 0.9;

                function leafCount(n) {
                    if (!n) return 0;
                    if (!n.children || n.children.length === 0) return 1;
                    return n.children.reduce((s, c) => s + leafCount(c), 0);
                }
                const leafCounts = {};
                Object.values(nodeMap).forEach(n => { leafCounts[n.id] = leafCount(n); });
                const totalLeaves = leafCounts[root.id] || 1;
                const margin = 60;

                function assignX(n, left, right) {
                    if (!n) return;
                    const lc = leafCounts[n.id] || 1;
                    const w = (right - left) * (lc / totalLeaves);
                    n.x = n === root ? LOGICAL_WIDTH / 2 : left + w / 2;
                    n.y = topMargin + (nodeLevel[n.id] || 0) * levelHeight;
                    let childLeft = left;
                    if (n.children) {
                        n.children.forEach(c => {
                            const cw = (right - left) * ((leafCounts[c.id] || 1) / totalLeaves);
                            assignX(c, childLeft, childLeft + cw);
                            childLeft += cw;
                        });
                    }
                }
                assignX(root, margin, LOGICAL_WIDTH - margin);
                Object.values(levels).forEach(levelNodes => {
                    if (!levelNodes || levelNodes.length === 0) return;
                    levelNodes.sort((a, b) => (a.x || 0) - (b.x || 0));
                    for (let i = 1; i < levelNodes.length; i++) {
                        if ((levelNodes[i].x || 0) - (levelNodes[i - 1].x || 0) < 70) levelNodes[i].x = (levelNodes[
                            i - 1].x || 0) + 70;
                    }
                    const avg = levelNodes.reduce((s, n) => s + (n.x || 0), 0) / levelNodes.length;
                    levelNodes.forEach(n => n.x = (n.x || 0) + LOGICAL_WIDTH / 2 - avg);
                    levelNodes.forEach(n => n.x = Math.max(margin, Math.min(LOGICAL_WIDTH - margin, n.x || 0)));
                });
            }

            function updateMapSelectorButtons() {
                const selector = document.getElementById('mapSelector');
                if (!selector) return;
                selector.innerHTML = '';
                for (let i = 0; i < maps.length; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'map-btn';
                    btn.dataset.index = i;
                    btn.textContent = '⏳ 地图' + (i + 1);
                    selector.appendChild(btn);
                }
                updateMapButtons();
            }

            function resetAndStartTutorial() {
                settlementInProgress = false;
                gameStarted = true;
                tutorialActive = true;
                tutorialPhase = 'map';
                tutorialStep = 1;
                tutorialPlayerChoseA = null;
                tutorialStep5Triggered = false;
                tutorialDigStructRevealed = false;
                tutorialDigOtherStructRevealed = {};
                globalMind = INITIAL_MIND;
                skillPoints = 0;
                timeBonusPerMap = 0;
                rareNodeBonus = 0;
                rewardMultiplier = 1;
                failSafeAvailable = false;
                failSafeUsed = false;
                inspireStructuresRevealed = 0;
                totalHistoricalScore = 0;
                globalRemainingTime = 20;
                globalMaxStaminaActual = 30;
                globalRemainingStamina = 30;
                activeMapIndex = 0;
                maps = [createTutorialMap()];
                updateMapSelectorButtons();
                gameOverOverlay.classList.add('hidden');
                skillUpgradeOverlay.classList.add('hidden');
                const modalContinueBtn = document.getElementById('btnModalContinue');
                if (modalContinueBtn) modalContinueBtn.classList.add('hidden');
                const badge = document.getElementById('tutorialBadge');
                if (badge) {
                    badge.textContent = '🎓 学习中';
                    badge.style.background = '#ff9800';
                    badge.style.display = 'inline-block';
                }
                const levelNameEl = document.getElementById('levelName');
                if (levelNameEl) levelNameEl.textContent = '教程';
                const levelBanner = document.getElementById('levelBanner');
                if (levelBanner) levelBanner.classList.remove('sim');
                const staminaDisplayEl = document.getElementById('staminaDisplay');
                const staminaRefEl = document.getElementById('staminaRef');
                const timeNumberEl = document.getElementById('timeNumber');
                if (staminaDisplayEl) staminaDisplayEl.textContent = globalRemainingStamina;
                if (staminaRefEl) staminaRefEl.textContent = globalMaxStaminaActual;
                if (timeNumberEl) timeNumberEl.textContent = globalRemainingTime;
                updateTutorialGuide(1, '欢迎来到树形探索推理教程！首先请点击🔵根节点 R 来解锁它。根节点是探索的起点。',
                    '💡 点击下方树形图中的圆形节点R。');
                setGlobalMessage('🎓 教程开始！请点击根节点R解锁。', 'info');
                updateActiveSkillsBar();
                updateMindDisplay();
                updateScoreProgress();
                refreshUIForActiveMap();
            }

            updateActiveSkillsBar();
            updateMindDisplay();
            updateScoreProgress();
            const staminaDisplayEl2 = document.getElementById('staminaDisplay');
            const staminaRefEl2 = document.getElementById('staminaRef');
            const timeNumberEl2 = document.getElementById('timeNumber');
            if (staminaDisplayEl2) staminaDisplayEl2.textContent = '30';
            if (staminaRefEl2) staminaRefEl2.textContent = '30';
            if (timeNumberEl2) timeNumberEl2.textContent = '20';
            updateTutorialGuide(null);
            const badgeEl = document.getElementById('tutorialBadge');
            if (badgeEl) badgeEl.style.display = 'none';
            gameStarted = false;
            maps = [];
            updateMapSelectorButtons();
            setTimeout(() => {
                resetAndStartTutorial();
            }, 300);
        })();
    </script>
