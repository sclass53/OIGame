<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>树形探索推理 · 教程</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --surface: #fff;
            --text: #222;
            --text-secondary: #555;
            --accent: #444;
            --correct: #555;
            --incorrect: #888;
            --time-fill: #666;
            --time-danger: #333;
            --stamina-fill: #999;
            --border: #ccc;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --skill-border: #aaa;
            --btn-restart-bg: #444;
            --btn-restart-hover: #333;
            --btn-complete-bg: #555;
            --btn-complete-border: #3a3a3a;
            --btn-complete-hover: #444;
            --dig-cell-bg: #e8e8e8;
            --dig-cell-revealed: #fafafa;
            --dig-time-extend: #5b9bd5;
            --dig-time-extend-light: #d6e8f7;
            --dig-rare-boost: #9b59b6;
            --dig-rare-boost-light: #ecdff2;
            --dig-fail-safe: #e6a817;
            --dig-fail-safe-light: #fff8e1;
            --dig-mind-box: #e8943a;
            --dig-time-box: #5b9bd5;
            --dig-inspire: #d4a017;
            --dig-inspire-light: #fef9e7;
            --guide-bg: #fffef5;
            --guide-border: #e6a817;
            --guide-highlight: #ff9800;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
        }
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            max-width: 1100px;
            width: 100%;
        }
        .game-container {
            background: var(--surface);
            border-radius: 20px;
            padding: 10px 18px 14px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: 1px solid var(--border);
            position: relative;
        }
        .level-banner {
            background: linear-gradient(135deg, #3a3a3a, #555);
            color: #fff;
            padding: 8px 24px;
            border-radius: 0 0 16px 16px;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 16px rgba(0, 0, 0, 0.25);
            z-index: 10;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .level-banner.sim {
            background: linear-gradient(135deg, #5a5a5a, #777);
        }
        .tutorial-badge {
            background: #ff9800;
            color: #fff;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            animation: pulseBadge 1.5s infinite alternate;
        }
        @keyframes pulseBadge {
            from {
                box-shadow: 0 0 6px rgba(255, 152, 0, 0.4);
            }
            to {
                box-shadow: 0 0 16px rgba(255, 152, 0, 0.8);
            }
        }
        .attrs-panel {
            width: 100%;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 6px 10px;
            background: #fafafa;
            border-radius: 14px;
            border: 1px solid #e0e0e0;
        }
        .attr-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            background: #fff;
            border-radius: 20px;
            border: 1.5px solid #d5d5d5;
            font-size: 0.8rem;
            font-weight: 600;
            color: #444;
            white-space: nowrap;
        }
        .attr-value {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #e0e0e0;
            color: #333;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .attr-value.high {
            background: #d0d0d0;
            color: #111;
        }
        .attr-value.low {
            background: #f0f0f0;
            color: #888;
        }
        .score-progress-panel {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 14px;
            background: #fafafa;
            border-radius: 30px;
            border: 1px solid #e0e0e0;
        }
        .score-progress-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #444;
            white-space: nowrap;
            min-width: 40px;
        }
        .score-bar-outer {
            flex: 1;
            height: 12px;
            background: #e8e8e8;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .score-bar-inner {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            border-radius: 8px;
            transition: width 0.4s, background-color 0.5s;
            background: #1a1a1a;
        }
        .score-number {
            font-size: 0.85rem;
            font-weight: 700;
            color: #333;
            min-width: 60px;
            text-align: right;
            white-space: nowrap;
        }
        .time-panel {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 14px;
            background: #fafafa;
            border-radius: 30px;
            border: 1px solid #e0e0e0;
        }
        .time-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #444;
            white-space: nowrap;
        }
        .time-bar-outer {
            flex: 1;
            height: 16px;
            background: #e8e8e8;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .stamina-bar,
        .time-bar-inner {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            border-radius: 10px;
            transition: width 0.35s;
        }
        .time-bar-inner {
            background: var(--time-fill);
        }
        .stamina-bar {
            background: var(--stamina-fill);
        }
        .time-number {
            font-size: 1.3rem;
            font-weight: 800;
            color: #222;
            min-width: 40px;
            text-align: center;
        }
        .canvas-wrapper {
            background: #fcfcfc;
            border-radius: 14px;
            border: 2px solid #ddd;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .info-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8rem;
            color: #777;
        }
        .legend {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.73rem;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.5px solid #999;
            background: #d0d0d0;
        }
        .legend-dot.important {
            background: #666;
            border-color: #444;
        }
        .legend-dot.result {
            background: #888;
            border-radius: 2px;
            border-color: #666;
        }
        .legend-dot.skill-node {
            background: #ccc;
            border-radius: 1px;
            border: 2px solid #999;
            transform: rotate(45deg);
            width: 10px;
            height: 10px;
            display: inline-block;
        }
        .legend-dot.check-ring {
            background: transparent;
            border-radius: 50%;
            border: 3px solid #444;
            width: 10px;
            height: 10px;
        }
        .legend-dot.correct-box {
            background: #555;
            border-radius: 2px;
            border: 2px solid #bbb;
            width: 10px;
            height: 10px;
        }
        .btn {
            padding: 10px 22px;
            border-radius: 25px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }
        .btn-restart {
            background: var(--btn-restart-bg);
            color: #fff;
        }
        .btn-restart:hover {
            background: var(--btn-restart-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        .btn-continue {
            background: #444;
            color: #fff;
            padding: 10px 24px;
            border-radius: 25px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-continue:hover {
            background: #333;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .overlay.hidden {
            display: none;
        }
        .modal {
            background: #fff;
            border-radius: 20px;
            padding: 28px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 680px;
            width: 90%;
            border: 1px solid #ddd;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h2 {
            font-size: 1.7rem;
            margin-bottom: 10px;
            color: #333;
        }
        .tutorial-guide-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--guide-bg);
            border: 3px solid var(--guide-border);
            border-radius: 16px;
            padding: 16px 22px;
            z-index: 90;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: slideUp 0.4s ease-out;
            pointer-events: auto;
        }
        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        .tutorial-guide-panel .guide-step {
            font-size: 0.7rem;
            color: #e6a817;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .tutorial-guide-panel .guide-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #333;
            margin: 6px 0;
            line-height: 1.5;
        }
        .tutorial-guide-panel .guide-hint {
            font-size: 0.73rem;
            color: #888;
            margin-top: 2px;
        }
        .dig-grid-container {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 12px 0;
            width: 100%;
            max-width: 500px;
            height: 500px;
            border: 2px solid #ccc;
            border-radius: 12px;
            overflow: hidden;
            background: #f0f0f0;
            user-select: none;
            -webkit-user-select: none;
        }
        .dig-viewport {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
            will-change: transform;
        }
        .dig-viewport.dragging {
            cursor: grabbing;
        }
        .dig-grid {
            position: absolute;
            display: grid;
            gap: 0;
            transform: translate(0, 0);
            transform-origin: 0 0;
            will-change: transform;
        }
        .dig-cell {
            width: 50px;
            height: 50px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            position: relative;
            border: 1px solid transparent;
            text-align: center;
            line-height: 1;
            word-break: break-all;
            box-sizing: border-box;
        }
        .dig-cell.unrevealed {
            background: var(--dig-cell-bg);
            border-color: #c5c5c5;
            color: #888;
        }
        .dig-cell.revealed {
            background: var(--dig-cell-revealed);
            border-color: #d5d5d5;
            cursor: default;
            color: #444;
            font-size: 0.55rem;
        }
        .dig-cell.revealed.reward-mind {
            background: #fff3e0;
            border: 3px solid var(--dig-mind-box);
            color: #8b5e2f;
            border-radius: 4px;
        }
        .dig-cell.revealed.reward-sp1 {
            background: #e8f5e9;
            border-color: #5a9a4b;
            color: #3d6b30;
        }
        .dig-cell.revealed.reward-sp2 {
            background: #c8e6c9;
            border-color: #388e3c;
            color: #1b5e20;
        }
        .dig-cell.revealed.reward-empty {
            background: #fafafa;
            border-color: #ddd;
            color: #ccc;
        }
        .dig-cell.revealed.reward-time-extend {
            background: #e8f2fa;
            border: 3px solid var(--dig-time-box);
            color: #2b5f8a;
            border-radius: 4px;
        }
        .dig-cell.revealed.reward-rare-boost {
            background: #f3eaf7;
            border-color: #9b59b6;
            color: #5b2d6e;
        }
        .dig-cell.revealed.reward-fail-safe {
            background: #fffcf0;
            border-color: #e6a817;
            color: #8a6d14;
        }
        .dig-cell.revealed.reward-inspire {
            background: var(--dig-inspire-light);
            border: 3px solid var(--dig-inspire);
            color: #6d5800;
            border-radius: 4px;
        }
        .dig-cell.revealed.reward-mind-box {
            background: #fff3e0;
            border: 3px solid #e8943a;
            color: #8b5e2f;
            border-radius: 4px;
        }
        .dig-legend {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 0.65rem;
            color: #666;
            margin: 4px 0;
        }
        .dig-legend-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .dig-legend-swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1.5px solid #bbb;
        }
        .dig-legend-swatch.te {
            background: #e8f2fa;
            border: 3px solid #5b9bd5;
        }
        .dig-legend-swatch.mb {
            background: #fff3e0;
            border: 3px solid #e8943a;
        }
        .dig-legend-swatch.rb {
            background: #f3eaf7;
            border-color: #9b59b6;
            border-width: 2px;
        }
        .dig-legend-swatch.fs {
            background: #fffcf0;
            border-color: #e6a817;
            border-width: 2px;
        }
        .dig-legend-swatch.insp {
            background: #fef9e7;
            border: 3px solid #d4a017;
        }
        .dig-legend-swatch.normal {
            background: #e8e8e8;
            border-color: #c5c5c5;
        }
        .dig-message {
            font-size: 0.78rem;
            font-weight: 600;
            text-align: center;
            padding: 8px 14px;
            border-radius: 8px;
            min-height: 10px;
            transition: 0.3s;
            margin: 4px 0;
            color: #555;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            z-index: 5;
            position: relative;
        }
        .dig-message.success {
            color: #3d6b30;
            background: #e8f5e9;
            border-color: #5a9a4b;
        }
        .dig-message.info {
            color: #2b5f8a;
            background: #e8f2fa;
            border-color: #5b9bd5;
        }
        .dig-message.warning {
            color: #8a6d14;
            background: #fffcf0;
            border-color: #e6a817;
        }
        .active-skills-bar {
            width: 100%;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 4px 8px;
            font-size: 0.7rem;
            color: #777;
            min-height: 20px;
        }
        .active-skill-tag {
            background: #e8e8e8;
            color: #444;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.68rem;
            white-space: nowrap;
        }
        .node-highlight-glow {
            animation: nodeGlowPulse 0.8s infinite alternate;
        }
        @keyframes nodeGlowPulse {
            from {
                filter: drop-shadow(0 0 4px rgba(255, 152, 0, 0.6));
            }
            to {
                filter: drop-shadow(0 0 14px rgba(255, 152, 0, 1));
            }
        }
        .map-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .map-btn {
            background: #f5f5f5;
            border: 2px solid #d5d5d5;
            color: #666;
            border-radius: 20px;
            padding: 5px 12px;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .map-btn.active {
            background: #444;
            border-color: #333;
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
        }
        .map-btn.win {
            background: #e8e8e8;
            border-color: #999;
            color: #333;
        }
        .map-btn.lose {
            background: #f5f5f5;
            border-color: #ccc;
            color: #888;
        }
        .global-message {
            width: 100%;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
            transition: 0.3s;
            color: #555;
            background: #fafafa;
            border: 1px solid #e0e0e0;
        }
        .global-message.success {
            color: #3d6b30;
            background: #e8f5e9;
            border-color: #5a9a4b;
        }
        .global-message.info {
            color: #2b5f8a;
            background: #e8f2fa;
            border-color: #5b9bd5;
        }
        .global-message.warning {
            color: #8a6d14;
            background: #fffcf0;
            border-color: #e6a817;
        }
        .global-message.blocked {
            color: #a04020;
            background: #fef0e8;
            border-color: #e8943a;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="game-container">
            <div class="level-banner sim" id="levelBanner">
                📖 <span id="levelName">教程</span>
                <span class="tutorial-badge" id="tutorialBadge">🎓 学习中</span>
                <span>💪精力:<span id="staminaDisplay">30</span></span>
            </div>
            <div class="global-message" id="globalMessage"></div>
            <div class="attrs-panel">
                <div class="attr-item"><span>🧠 思维</span><span class="attr-value" id="mindValue">4</span></div>
            </div>
            <div class="active-skills-bar" id="activeSkillsBar"></div>
            <div class="score-progress-panel">
                <span class="score-progress-label">📊 总分</span>
                <div class="score-bar-outer">
                    <div class="score-bar-inner" id="scoreBarInner"></div>
                </div>
                <span class="score-number" id="scoreNumber">0 / 100</span>
            </div>
            <div class="time-panel">
                <span>⏱️</span>
                <span class="time-label">时间 / 精力</span>
                <div class="time-bar-outer">
                    <div class="stamina-bar" id="staminaBar"></div>
                    <div class="time-bar-inner" id="timeBarInner"></div>
                </div>
                <span class="time-number" id="timeNumber">20</span>
                <span style="font-size:0.7rem;color:#888;">/ 精力<span id="staminaRef">30</span></span>
            </div>
            <div class="map-selector" id="mapSelector"></div>
            <div class="canvas-wrapper"><canvas id="treeCanvas"></canvas></div>
            <div class="info-bar">
                <div class="legend">
                    <span class="legend-item"><span class="legend-dot"></span> 过程</span>
                    <span class="legend-item"><span class="legend-dot important"></span> 检查节点</span>
                    <span class="legend-item"><span class="legend-dot result"></span> 结果(方)</span>
                    <span class="legend-item"><span class="legend-dot skill-node"></span> 特殊奖励</span>
                    <span class="legend-item"><span class="legend-dot check-ring"></span> 可检查</span>
                    <span class="legend-item"><span class="legend-dot correct-box"></span> 正确路径虚线框</span>
                </div>
                <span id="correctFoundHint" style="display:none;background:#e0e0e0;color:#222;padding:4px 10px;border-radius:12px;font-weight:600;font-size:0.75rem;">✅正确路径已找到！</span>
            </div>
            <button class="btn btn-restart" id="btnRestart">🔄 重新开始教程</button>
        </div>
    </div>

    <div class="tutorial-guide-panel hidden" id="tutorialGuidePanel">
        <div class="guide-step" id="guideStepLabel">步骤 1/7</div>
        <div class="guide-text" id="guideText"></div>
        <div class="guide-hint" id="guideHint"></div>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
        <div class="modal" id="gameOverModal">
            <h2 id="modalTitle"></h2>
            <p id="modalText"></p>
            <div id="modalButtons" style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-restart" id="btnModalRestart">🔄 重新开始教程</button>
                <button class="btn-continue hidden" id="btnModalContinue">▶ 进入CSP-S模拟赛练习</button>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="skillUpgradeOverlay">
        <div class="modal" id="digModal">
            <h2>⛏️ 平面挖掘探索</h2>
            <p style="font-weight:700;">💡 技能点：<span id="digSkillPoints">0</span></p>
            <p style="font-weight:700;">🧠 当前思维：<span id="digMindDisplay">4</span></p>
            <p id="digBonusInfo" style="font-size:0.75rem;color:#666;"></p>
            <div class="dig-message" id="digMessage"></div>
            <div class="dig-grid-container">
                <div class="dig-viewport" id="digViewport">
                    <div class="dig-grid" id="digGrid"></div>
                </div>
            </div>
            <div class="dig-legend">
                <span class="dig-legend-item"><span class="dig-legend-swatch te"></span> 时间扩展 (⏰+3)</span>
                <span class="dig-legend-item"><span class="dig-legend-swatch mb"></span> 思维块 (🧠+1)</span>
                <span class="dig-legend-item"><span class="dig-legend-swatch rb"></span> 稀有提升 (💠+0.5)</span>
                <span class="dig-legend-item"><span class="dig-legend-swatch fs"></span> 失败保护 (🛡️)</span>
                <span class="dig-legend-item"><span class="dig-legend-swatch insp"></span> 振奋 (⚡+1)</span>
                <span class="dig-legend-item"><span class="dig-legend-swatch normal"></span> 普通块</span>
            </div>
            <p style="font-size:0.7rem;color:#888;">消耗1技能点挖掘一个方块 | 只能挖掘已探索方块相邻的格子</p>
            <p style="font-size:0.7rem;color:#999;" id="digRemainingHint"></p>
            <button class="btn-continue" id="btnCloseDig">▶ 完成挖掘，开始练习赛</button>
        </div>
    </div>

    <script>
        (function() {
            const LOGICAL_WIDTH = 1200;
            const LOGICAL_HEIGHT = 700;
            const canvas = document.getElementById('treeCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = LOGICAL_WIDTH;
            canvas.height = LOGICAL_HEIGHT;

            const DIG_ROWS = 20;
            const DIG_COLS = 20;
            const INITIAL_MIND = 4;

            let skillPoints = 0;
            let globalMind = INITIAL_MIND;
            let maps = [];
            let activeMapIndex = 0;
            let globalRemainingTime = 20;
            let globalRemainingStamina = 30;
            let globalMaxStaminaActual = 30;
            let gameStarted = false;
            let totalHistoricalScore = 0;
            let timeBonusPerMap = 0;
            let rareNodeBonus = 0;
            let rewardMultiplier = 1;
            let failSafeAvailable = false;
            let failSafeUsed = false;
            let inspireStructuresRevealed = 0;
            let settlementInProgress = false;

            let digGridCells = null;
            let digGridRevealed = null;
            let digCellStructureMap = null;
            let digStructureGroups = [];
            let digDragStart = null;
            let digViewportTransform = { x: 0, y: 0 };

            let tutorialStep = 1;
            let tutorialActive = true;
            let tutorialPhase = 'map';
            let tutorialDigStructRevealed = false;
            let tutorialPlayerChoseA = null;
            let tutorialStep5Triggered = false;
            let tutorialDigOtherStructRevealed = {}; // 跟踪教程挖掘场中揭示的其他结构

            const gameOverOverlay = document.getElementById('gameOverOverlay');
            const skillUpgradeOverlay = document.getElementById('skillUpgradeOverlay');
            const tutorialGuidePanel = document.getElementById('tutorialGuidePanel');

            function randomInt(min, max) {
                if (min > max) return min;
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function seededRandom(seed) {
                let s = seed;
                return function() {
                    s = (s * 16807 + 0) % 2147483647;
                    return (s - 1) / 2147483646;
                };
            }

            function getNodeSeed(nodeId) {
                let hash = 0;
                for (let i = 0; i < nodeId.length; i++) {
                    hash = ((hash << 5) - hash) + nodeId.charCodeAt(i);
                    hash |= 0;
                }
                return Math.abs(hash);
            }

            function formatSkillPoints(sp) {
                if (Number.isInteger(sp)) return sp.toString();
                return sp.toFixed(1);
            }

            function setGlobalMessage(msg, type) {
                const el = document.getElementById('globalMessage');
                if (!el) return;
                el.textContent = msg;
                el.className = 'global-message';
                if (type && ['warning', 'success', 'info', 'blocked'].includes(type)) el.classList.add(type);
                if (msg) {
                    clearTimeout(el._timeout);
                    el._timeout = setTimeout(() => {
                        el.textContent = '';
                        el.className = 'global-message';
                    }, 6000);
                }
            }

            function setDigMessage(msg, type, durationMs) {
                const el = document.getElementById('digMessage');
                if (!el) return;
                el.textContent = msg;
                el.className = 'dig-message';
                if (type && ['warning', 'success', 'info'].includes(type)) el.classList.add(type);
                if (msg) {
                    clearTimeout(el._timeout);
                    const dur = durationMs || 5000;
                    el._timeout = setTimeout(() => {
                        el.textContent = '';
                        el.className = 'dig-message';
                    }, dur);
                }
            }

            function updateTutorialGuide(step, text, hint) {
                const panel = tutorialGuidePanel;
                if (!panel) return;
                if (step === null) {
                    panel.classList.add('hidden');
                    return;
                }
                panel.classList.remove('hidden');
                document.getElementById('guideStepLabel').textContent = '步骤 ' + step + '/7';
                document.getElementById('guideText').textContent = text;
                document.getElementById('guideHint').textContent = hint || '';
            }

            function getTutorialHighlightNodeId() {
                if (!tutorialActive || tutorialPhase !== 'map') return null;
                switch (tutorialStep) {
                    case 1:
                        return 'R';
                    case 2:
                        return 'A';
                    case 3:
                        return tutorialPlayerChoseA ? 'A' : 'B';
                    case 4:
                        return null;
                    case 5:
                        return tutorialPlayerChoseA ? 'B' : 'A';
                    case 6:
                        return 'B1';
                    default:
                        return null;
                }
            }

            function updateActiveSkillsBar() {
                const bar = document.getElementById('activeSkillsBar');
                if (bar) {
                    let parts = [];
                    parts.push('<span class="active-skill-tag">💎技能点: ' + formatSkillPoints(skillPoints) + '</span>');
                    parts.push('<span class="active-skill-tag">🧠思维: ' + globalMind + '</span>');
                    if (timeBonusPerMap > 0) parts.push('<span class="active-skill-tag">⏰+' + timeBonusPerMap +
                        '</span>');
                    if (rareNodeBonus > 0) parts.push('<span class="active-skill-tag">💠+' + rareNodeBonus.toFixed(1) +
                        '</span>');
                    if (rewardMultiplier > 1) parts.push('<span class="active-skill-tag">🔷×' + rewardMultiplier.toFixed(
                        1) + '</span>');
                    if (inspireStructuresRevealed > 0) parts.push('<span class="active-skill-tag">⚡振奋×' +
                        inspireStructuresRevealed + '</span>');
                    if (failSafeAvailable && !failSafeUsed) parts.push(
                        '<span class="active-skill-tag">🛡️失败保护可用</span>');
                    bar.innerHTML = parts.join(' ');
                }
            }

            function updateMindDisplay() {
                const mindEl = document.getElementById('mindValue');
                if (mindEl) {
                    mindEl.textContent = globalMind;
                    mindEl.classList.toggle('high', globalMind > 6);
                    mindEl.classList.toggle('low', globalMind < 3);
                }
                const digMindEl = document.getElementById('digMindDisplay');
                if (digMindEl) digMindEl.textContent = globalMind;
            }

            function updateScoreProgress() {
                const scoreBarInner = document.getElementById('scoreBarInner');
                const scoreNumber = document.getElementById('scoreNumber');
                if (!scoreBarInner || !scoreNumber) return;
                if (!maps || maps.length === 0) {
                    scoreBarInner.style.width = '0%';
                    scoreBarInner.style.backgroundColor = '#1a1a1a';
                    scoreNumber.textContent = '0 / 100';
                    return;
                }
                const totalScore = maps.reduce((s, m) => s + (m.maxResultScore || 0), 0);
                const maxPossible = maps.length * 100;
                const ratio = maxPossible > 0 ? Math.min(1, totalScore / maxPossible) : 0;
                const lightness = 10 + ratio * 82;
                const fillColor = `hsl(0, 0%, ${lightness}%)`;
                scoreBarInner.style.width = (ratio * 100) + '%';
                scoreBarInner.style.backgroundColor = fillColor;
                scoreNumber.textContent = totalScore + ' / ' + maxPossible;
            }

            function getActiveMap() {
                if (!maps || maps.length === 0) return null;
                if (activeMapIndex < 0 || activeMapIndex >= maps.length) return null;
                return maps[activeMapIndex];
            }

            function staminaCostForNode(node) {
                if (!node) return 1;
                return Math.max(1, (node.reqValue || 0) - globalMind);
            }

            function canUnlock(node, map) {
                if (!node || !map) return false;
                if (node.state !== 'visible_locked' || map.gameOver || globalRemainingTime <= 0 || globalRemainingStamina <=
                    0) return false;
                if (node === map.root) return true;
                const parent = node.parent;
                if (!parent) return false;
                if (parent.state !== 'unlocked' && parent.state !== 'correct' && parent.state !== 'incorrect') return false;
                // 限制：如果父节点是important类型且状态为unlocked（已解锁但未检查），禁止解锁子节点
                if (parent.type === 'important' && parent.state === 'unlocked') {
                    setGlobalMessage('⚠️ 请先检查节点 "' + parent.name + '"（点击其外圈圆环），然后才能解锁它的子节点。', 'blocked');
                    return false;
                }
                return true;
            }

            function canCheck(node, map) {
                if (!node || !map) return false;
                if (node.state !== 'unlocked' || map.gameOver || globalRemainingTime <= 0 || globalRemainingStamina <= 0)
                    return false;
                if (node.type === 'important' || node.type === 'result' || node.type === 'skill') return true;
                return false;
            }

            function computeMaxScore(map) {
                if (!map || !map.nodeMap) return 0;
                let max = 0;
                Object.values(map.nodeMap).filter(n => n.type === 'result' || n.type === 'skill').forEach(r => {
                    if ((r.state === 'correct' || r.state === 'incorrect') && r.score !== null && r.score > max)
                        max = r.score;
                });
                if (max === 0 && map.gameResult === 'win' && map.correctResult && map.correctResult.score != null) max = map
                    .correctResult.score;
                return max;
            }

            function markCorrect(n) {
                if (!n) return;
                if (n.state !== 'correct') {
                    if (n.type === 'skill') {
                        const spGain = 1 + (rareNodeBonus || 0);
                        skillPoints += spGain;
                        updateActiveSkillsBar();
                    }
                    n.state = 'correct';
                }
            }

            function markIncorrect(n) {
                if (!n) return;
                if (n.state === 'incorrect' || n.state === 'correct') return;
                n.state = 'incorrect';
                if (n.children && n.children.length > 0) {
                    n.children.forEach(c => markIncorrect(c));
                }
            }

            function checkFork(fork) {
                if (!fork || !fork.isFork || fork.state === 'incorrect' || fork.state === 'correct') return;
                if (fork.children && fork.children.every(c => c.state === 'incorrect')) {
                    markIncorrect(fork);
                    if (fork.parent && fork.parent.isFork) checkFork(fork.parent);
                }
            }

            function getMaxSubResult(node) {
                if (!node) return 0;
                if (node.type === 'result' || node.type === 'skill') return node.score || 0;
                let max = 0;

                function dfs(n) {
                    if (!n) return;
                    if ((n.type === 'result' || n.type === 'skill') && n.score > max) max = n.score;
                    if (n.children) n.children.forEach(dfs);
                }
                dfs(node);
                return max;
            }

            function unlockNode(node, map) {
                if (!canUnlock(node, map)) return false;
                globalRemainingTime = Math.max(0, globalRemainingTime - 1);
                const staminaCost = staminaCostForNode(node);
                globalRemainingStamina = Math.max(0, globalRemainingStamina - staminaCost);
                map.totalUnlocked = (map.totalUnlocked || 0) + 1;
                node.state = 'unlocked';
                if (node.children) {
                    node.children.forEach(c => {
                        if (c.state === 'hidden') c.state = 'visible_locked';
                    });
                }
                if (node === map.correctResult && node.type === 'skill') {
                    const spGain = 1 + (rareNodeBonus || 0);
                    skillPoints += spGain;
                    updateActiveSkillsBar();
                }
                if (globalRemainingTime <= 0 || globalRemainingStamina <= 0) {
                    maps.forEach(m => {
                        if (!m.gameOver) {
                            if (m.correctResult && m.correctResult.state === 'correct') endMapGame(m, 'win');
                            else endMapGame(m, 'lose');
                        }
                    });
                    refreshUIForActiveMap();
                    checkAllMapsComplete();
                    return true;
                }
                checkTutorialProgressAfterAction(node, 'unlock');
                refreshUIForActiveMap();
                return true;
            }

            function performCheck(node, map) {
                if (!canCheck(node, map)) return false;
                const timeCost = 1;
                const baseStaminaCost = staminaCostForNode(node);
                globalRemainingTime = Math.max(0, globalRemainingTime - timeCost);
                globalRemainingStamina = Math.max(0, globalRemainingStamina - baseStaminaCost);
                map.totalStaminaSpent = (map.totalStaminaSpent || 0) + baseStaminaCost;
                if (globalRemainingTime <= 0 || globalRemainingStamina <= 0) {
                    maps.forEach(m => {
                        if (!m.gameOver) {
                            if (m.correctResult && m.correctResult.state === 'correct') endMapGame(m, 'win');
                            else endMapGame(m, 'lose');
                        }
                    });
                    refreshUIForActiveMap();
                    checkAllMapsComplete();
                    return true;
                }
                if (node.isCorrectPath) {
                    markCorrect(node);
                    if (node === map.correctResult && node.type === 'skill') {
                        const spGain = 1 + (rareNodeBonus || 0);
                        skillPoints += spGain;
                        updateActiveSkillsBar();
                    }
                    let fork = node.parent;
                    while (fork && !fork.isFork) fork = fork.parent;
                    if (fork && fork.isFork) {
                        let cur = node;
                        while (cur && cur !== fork) {
                            if (cur.type === 'process' || cur.type === 'skill') markCorrect(cur);
                            cur = cur.parent;
                        }
                    }
                    if (node === map.correctResult) {
                        map.maxResultScore = computeMaxScore(map);
                        endMapGame(map, 'win');
                        refreshUIForActiveMap();
                        checkTutorialProgressAfterAction(node, 'check');
                        checkAllMapsComplete();
                        return true;
                    }
                    let p = node.parent;
                    while (p) {
                        if (p.isCorrectPath) markCorrect(p);
                        p = p.parent;
                    }
                } else {
                    node.state = 'incorrect';
                    let fork = node.parent;
                    while (fork && !fork.isFork) fork = fork.parent;
                    if (fork && fork.isFork) {
                        let cur = node;
                        while (cur && cur !== fork) {
                            if (cur.type === 'process' || cur.type === 'skill') cur.state = 'incorrect';
                            cur = cur.parent;
                        }
                        checkFork(fork);
                    }
                }
                map.maxResultScore = computeMaxScore(map);
                checkTutorialProgressAfterAction(node, 'check');
                refreshUIForActiveMap();
                return true;
            }

            function endMapGame(map, result) {
                if (!map) return;
                map.gameOver = true;
                map.gameResult = result;
                map.maxResultScore = computeMaxScore(map);
                Object.values(map.nodeMap).forEach(n => {
                    if (n.state === 'hidden') n.state = 'visible_locked';
                });
                if (result === 'lose' && map.correctResult) {
                    let cur = map.correctResult;
                    while (cur) {
                        if (cur.state !== 'incorrect') cur.state = 'correct';
                        cur = cur.parent;
                    }
                }
                if (map === getActiveMap()) refreshUIForActiveMap();
                updateMapButtons();
            }

            function isCorrectFound(map) {
                return map && map.correctResult && map.correctResult.state === 'correct';
            }

            function checkAllMapsComplete() {
                if (!gameStarted || tutorialActive) return;
                const allDone = maps.every(m => m.gameOver);
                const noResources = globalRemainingTime <= 0 || globalRemainingStamina <= 0;
                if (allDone || (noResources && maps.every(m => m.gameOver || m.totalUnlocked > 0))) {
                    // 确保所有地图都已结束
                    maps.forEach(m => {
                        if (!m.gameOver) {
                            if (m.correctResult && m.correctResult.state === 'correct') endMapGame(m, 'win');
                            else endMapGame(m, 'lose');
                        }
                    });
                    const totalScore = maps.reduce((s, m) => s + (m.maxResultScore || 0), 0);
                    const maxPossible = maps.length * 100;
                    const passLine = Math.floor(maxPossible * 0.5);
                    const passed = totalScore >= passLine;
                    document.getElementById('modalTitle').textContent = passed ? '🎉 模拟赛结束！' : '📋 模拟赛结束';
                    document.getElementById('modalText').textContent =
                        '总分：' + totalScore + ' / ' + maxPossible + '（通过线：' + passLine + '分）\n' +
                        (passed ? '恭喜通过！你可以在挖掘场继续提升能力。' : '未达到通过线，可以重新尝试或进入挖掘场提升能力。');
                    document.getElementById('modalButtons').innerHTML = `
                        <button class="btn btn-restart" id="btnModalRestart2">🔄 重新开始教程</button>
                        <button class="btn-continue" id="btnModalDig2">⛏️ 进入挖掘场</button>
                        <button class="btn-continue" id="btnModalRetrySim">▶ 重新生成模拟赛</button>
                    `;
                    document.getElementById('btnModalRestart2').addEventListener('click', () => {
                        gameOverOverlay.classList.add('hidden');
                        resetAndStartTutorial();
                    });
                    document.getElementById('btnModalDig2').addEventListener('click', () => {
                        gameOverOverlay.classList.add('hidden');
                        showNormalDigOverlay();
                    });
                    document.getElementById('btnModalRetrySim').addEventListener('click', () => {
                        gameOverOverlay.classList.add('hidden');
                        startNormalGame();
                    });
                    gameOverOverlay.classList.remove('hidden');
                    updateScoreProgress();
                    updateMapButtons();
                }
            }

            function checkTutorialProgressAfterAction(node, actionType) {
                if (!tutorialActive || tutorialPhase !== 'map') return;
                const map = getActiveMap();
                if (!map) return;
                switch (tutorialStep) {
                    case 1:
                        if (actionType === 'unlock' && node.id === 'R' && node.state === 'unlocked') {
                            tutorialStep = 2;
                            updateTutorialGuide(2,
                                '很好！现在请点击任意一个🔷检查节点（A或B）来解锁它。解锁后，请先检查它（点击外圈圆环），然后才能解锁其子结果节点。',
                                '💡 点击左侧A节点试试——但解锁后必须先检查它，才能看到子节点。');
                            setGlobalMessage('✅ 第1步完成！根节点已解锁，请继续点击检查节点A。', 'success');
                            refreshUIForActiveMap();
                        }
                        break;
                    case 2:
                        if (actionType === 'unlock' && (node.id === 'A' || node.id === 'B') && node.state === 'unlocked') {
                            tutorialPlayerChoseA = (node.id === 'A');
                            tutorialStep = 3;
                            const checkNodeId = tutorialPlayerChoseA ? 'A' : 'B';
                            updateTutorialGuide(3,
                                '解锁了！现在请🔍检查这个节点（点击节点外围的圆环）。检查节点会显示它下面所有结果节点中的最高分。注意：在检查之前，你不能解锁它的子节点。',
                                '💡 点击' + checkNodeId + '节点外圈的圆环来进行检查。');
                            setGlobalMessage('✅ 第2步完成！现在请检查节点' + checkNodeId + '（点击其外圈圆环）。',
                                'success');
                            refreshUIForActiveMap();
                        }
                        break;
                    case 3:
                        if (actionType === 'check' && (node.id === 'A' || node.id === 'B') && (node.state ===
                                'correct' || node.state === 'incorrect')) {
                            const maxScore = getMaxSubResult(node);
                            tutorialStep = 4;
                            const resultNodeHint = (node.id === 'A') ? 'A1（70分）' : '该检查节点下分数最高的结果节点';
                            updateTutorialGuide(4,
                                '检查完成！节点上显示的数字 ' + maxScore +
                                ' 就是该检查节点下所有结果节点的最高分。现在请解锁任意一个结果节点，然后检查它来获取分数。',
                                '💡 点击' + resultNodeHint + '来解锁并检查。最终分数取所有已检查结果节点的最高分。');
                            setGlobalMessage('✅ 第3步完成！节点最高分是' + maxScore + '，请解锁一个结果节点。', 'success');
                            refreshUIForActiveMap();
                        }
                        break;
                    case 4:
                        if (actionType === 'check' && (node.type === 'result' || node.type === 'skill') && (node.state ===
                                'correct' || node.state === 'incorrect')) {
                            tutorialStep = 5;
                            tutorialStep5Triggered = false;
                            const otherCheckNodeId = tutorialPlayerChoseA ? 'B' : 'A';
                            updateTutorialGuide(5,
                                '获得了分数！该地图的最终得分会取所有已检查结果节点中的最高分。现在请点击并检查另一个检查节点 ' +
                                otherCheckNodeId +
                                '。如果检查后出现虚线框，说明它下面有正确结果节点（100分）。',
                                '💡 点击' + otherCheckNodeId + '节点并检查它。正确路径上的节点会有虚线框标记。');
                            setGlobalMessage('✅ 第4步完成！现在请检查另一个检查节点' + otherCheckNodeId + '。', 'success');
                            refreshUIForActiveMap();
                        }
                        break;
                    case 5:
                        if (actionType === 'check' && (node.id === 'A' || node.id === 'B') && !tutorialStep5Triggered) {
                            tutorialStep5Triggered = true;
                            const isCorrectPathNode = node.isCorrectPath;
                            if (isCorrectPathNode) {
                                tutorialStep = 6;
                                const correctResultNode = map.correctResult;
                                if (correctResultNode && correctResultNode.id === 'B1') {
                                    correctResultNode.reqValue = 5;
                                    correctResultNode.type = 'skill';
                                    correctResultNode.name = '💎B1';
                                    correctResultNode.score = 100;
                                    map.hasSkillNode = true;
                                    map.skillNodeId = correctResultNode.id;
                                }
                                updateTutorialGuide(6,
                                    '虚线框代表正确路径！现在请点击正确结果节点 💎B1（100分）并检查它。注意：该节点的思维需求已提升至5（你的思维是4），思维需求大于思维时需要额外付出精力。精力初始为时间的1.5倍，但如果思维不够，再多的精力也不够用。检查特殊奖励节点可以获得技能点奖励！',
                                    '💡 点击B1解锁后检查它。思维需求(5) > 思维(4)，需要消耗更多精力。');
                                setGlobalMessage(
                                    '✅ 第5步完成！虚线框标记了正确路径。B1的思维需求已提升至5，请解锁并检查它。',
                                    'success');
                            } else {
                                updateTutorialGuide(5,
                                    '这个节点不在正确路径上（没有虚线框）。请检查另一个检查节点来找到正确路径。正确路径上的检查节点会有虚线框标记。',
                                    '💡 点击另一个检查节点（有虚线框的那个）来找到正确路径。');
                                setGlobalMessage('ℹ️ 该节点不在正确路径上，请检查另一个检查节点。', 'info');
                                tutorialStep5Triggered = false;
                            }
                            refreshUIForActiveMap();
                        }
                        break;
                    case 6:
                        if (actionType === 'check' && node.id === 'B1' && node.state === 'correct') {
                            tutorialStep = 7;
                            tutorialPhase = 'dig';
                            skillPoints += 20;
                            updateActiveSkillsBar();
                            updateTutorialGuide(7,
                                '太棒了！你获得了100分和技能点奖励。技能点可以用来在挖掘场中提升能力。现在请进入挖掘场，消耗技能点挖掘方块。在起始位置旁边有一个⏰时间扩展结构（3格），挖完它可以让每场比赛的初始时间+3！挖掘场中还有更多结构等你发现。',
                                '💡 点击下方"开始挖掘"按钮进入挖掘场。从(0,0)出发，3步内挖完时间扩展结构。');
                            setGlobalMessage(
                                '✅ 第6步完成！获得100分+技能点！现在请进入挖掘场（即将自动打开）。', 'success');
                            refreshUIForActiveMap();
                            setTimeout(() => {
                                showTutorialDigOverlay();
                            }, 1200);
                        }
                        break;
                    default:
                        break;
                }
            }

            function refreshUIForActiveMap() {
                const map = getActiveMap();
                if (!map) return;
                const timeNumberEl = document.getElementById('timeNumber');
                const staminaRefEl = document.getElementById('staminaRef');

                if (staminaRefEl) staminaRefEl.textContent = globalMaxStaminaActual;
                if (staminaDisplayEl) staminaDisplayEl.textContent = globalRemainingStamina;
                const timeRatio = Math.min(1, globalRemainingTime / Math.max(1, 20 + (timeBonusPerMap || 0)));
                const staminaRatio = Math.min(1, globalRemainingStamina / Math.max(1, globalMaxStaminaActual));
                const timeBar = document.getElementById('timeBarInner');
                const staminaBar = document.getElementById('staminaBar');
                if (timeBar) timeBar.style.width = (timeRatio * 100) + '%';
                if (staminaBar) staminaBar.style.width = (staminaRatio * 100) + '%';
                if (timeBar && staminaBar) {
                    if (timeRatio >= staminaRatio) {
                        timeBar.style.zIndex = 1;
                        staminaBar.style.zIndex = 2;
                    } else {
                        timeBar.style.zIndex = 2;
                        staminaBar.style.zIndex = 1;

                        correctFoundHint.style.display = 'inline-block';
                    } else {
                        correctFoundHint.style.display = 'none';
                    }
                }
                updateMindDisplay();
                updateScoreProgress();
                updateMapButtons();
                drawTree(map);

            function updateMapButtons() {
                const buttons = document.querySelectorAll('.map-btn');
                buttons.forEach(btn => {

            function drawTree(map) {
                if (!map || !map.nodeMap) return;
                ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
                ctx.fillStyle = '#fcfcfc';
                ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
                const visible = Object.values(map.nodeMap).filter(n => n.state !== 'hidden');
                const highlightNodeId = getTutorialHighlightNodeId();
                visible.forEach(n => {
                    if (n.children) {
                        n.children.forEach(c => {
                            if (c.state !== 'hidden') drawEdge(n, c);
                        });
                    }
                });
                visible.forEach(n => drawNode(n, map, n.id === highlightNodeId));
                if (map.gameOver && map.gameResult === 'lose') {
                    const correct = Object.values(map.nodeMap).filter(n => n.isCorrectPath && n.state !== 'hidden');
                    correct.forEach(n => {
                        const r = (n.type === 'important' ? 22 : 20) + 6;
                        ctx.save();
                        ctx.strokeStyle = 'rgba(80,80,80,0.7)';
                        ctx.lineWidth = 3;
                        ctx.setLineDash([5, 3]);
                        ctx.beginPath();
                        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        ctx.restore();
                    });
                }
            }

            function drawEdge(p, c) {
                let col = '#999';
                if (p.state === 'correct' && c.state === 'correct') col = '#555';
                else if (p.state === 'incorrect' || c.state === 'incorrect') col = '#bbb';
                ctx.strokeStyle = col;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(c.x, c.y);
                ctx.stroke();
            }

            function drawNode(node, map, isHighlighted) {
                const cx = node.x;
                const cy = node.y;
                const r = node.type === 'important' ? 22 : 20;
                let fill, stroke, textColor;
                switch (node.state) {
                    case 'visible_locked':
                        fill = node.type === 'process' ? '#d5d5d5' : (node.type === 'important' ? '#888' : '#999');
                        stroke = '#b0b0b0';
                        textColor = node.type === 'important' ? '#fff' : '#444';
                        break;
                    case 'unlocked':
                        fill = '#3a3a3a';
                        stroke = '#1a1a1a';
                        textColor = '#fff';
                        break;
                    case 'correct':
                        fill = '#3a3a3a';
                        stroke = '#1a1a1a';
                        textColor = '#fff';
                        break;
                    case 'incorrect':
                        fill = '#ffffff';
                        stroke = '#999';
                        textColor = '#555';
                        break;
                    default:
                        return;
                }
                ctx.save();
                if (isHighlighted && tutorialActive && tutorialPhase === 'map') {
                    ctx.shadowColor = 'rgba(255,152,0,0.9)';
                    ctx.shadowBlur = 20;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                }
                if (node.type === 'skill') {
                    stroke = node.state === 'incorrect' ? '#999' : (node.state === 'correct' ? '#1a1a1a' : '#aaa');
                    ctx.fillStyle = fill;
                    ctx.strokeStyle = stroke;
                    ctx.lineWidth = 2.5;
                    if (node.state === 'incorrect') ctx.setLineDash([5, 3]);
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - r);
                    ctx.lineTo(cx + r, cy);
                    ctx.lineTo(cx, cy + r);
                    ctx.lineTo(cx - r, cy);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.setLineDash([]);
                    node._bounds = { x: cx - r, y: cy - r, w: r * 2, h: r * 2 };
                } else if (node.type === 'result') {
                    const halfSide = r * 0.85;
                    ctx.fillStyle = fill;
                    ctx.strokeStyle = stroke;
                    ctx.lineWidth = 2.5;
                    if (node.state === 'incorrect') ctx.setLineDash([5, 3]);
                    ctx.beginPath();
                    ctx.rect(cx - halfSide, cy - halfSide, halfSide * 2, halfSide * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.setLineDash([]);
                    node._bounds = { x: cx - halfSide, y: cy - halfSide, w: halfSide * 2, h: halfSide * 2 };
                } else {
                    ctx.fillStyle = fill;
                    ctx.strokeStyle = stroke;
                    ctx.lineWidth = 2.5;
                    if (node.state === 'incorrect') ctx.setLineDash([5, 3]);
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.setLineDash([]);
                    node._bounds = null;
                }
                if (node.state === 'incorrect') {
                    const rng = seededRandom(getNodeSeed(node.id));
                    for (let i = 0; i < 3; i++) {
                        const angle = rng() * Math.PI * 2;
                        const effectiveR = node.type === 'result' ? r * 0.85 : r;
                        const len = effectiveR * (0.65 + rng() * 0.5);
                        const startX = cx + Math.cos(angle) * len * 0.3;
                        const startY = cy + Math.sin(angle) * len * 0.3;
                        const endX = cx + Math.cos(angle) * len;
                        const endY = cy + Math.sin(angle) * len;
                        ctx.strokeStyle = '#aaa';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([]);
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.lineTo(endX, endY);
                        ctx.stroke();
                        const perpAngle = angle + Math.PI / 2;
                        const branchLen = len * 0.25;
                        const midX = (startX + endX) / 2;
                        const midY = (startY + endY) / 2;
                        ctx.beginPath();
                        ctx.moveTo(midX, midY);
                        ctx.lineTo(midX + Math.cos(perpAngle) * branchLen, midY + Math.sin(perpAngle) * branchLen);
                        ctx.stroke();
                    }
                }
                if (node.state === 'correct') {
                    const boxSize = (node.type === 'result' ? r * 0.85 : r) + 7;
                    ctx.strokeStyle = '#bbb';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 3]);
                    ctx.beginPath();
                    ctx.rect(cx - boxSize, cy - boxSize, boxSize * 2, boxSize * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                if (node.state === 'unlocked') {
                    const canShowCheckRing = (node.type === 'important' || node.type === 'result' || node.type === 'skill');
                    if (canShowCheckRing && !map.gameOver) {
                        const ringR = (node.type === 'result' ? r * 0.85 : r) + 5;
                        ctx.strokeStyle = '#333';
                        ctx.lineWidth = 2.8;
                        ctx.setLineDash([]);
                        ctx.beginPath();
                        ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
                        ctx.stroke();
                        node._checkBounds = { x: cx - ringR - 3, y: cy - ringR - 3, w: (ringR + 3) * 2, h: (ringR + 3) *
                                2 };
                    } else {
                        node._checkBounds = null;
                    }
                } else {
                    node._checkBounds = null;
                }
                if (node.state === 'incorrect') {
                    const score = getMaxSubResult(node);
                    ctx.fillStyle = '#888';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(score, cx, cy);
                } else {
                    ctx.fillStyle = textColor;
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(node.name, cx, cy);
                    if ((node.type === 'result' || node.type === 'skill') && node.score !== null && (node.state ===
                            'unlocked' || node.state === 'correct')) {
                        ctx.font = 'bold 9px sans-serif';
                        ctx.fillText(node.score, cx, cy + 12);
                    }
                }
                const staminaCost = staminaCostForNode(node);
                ctx.fillStyle = '#777';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(staminaCost, cx, cy - r - 3);
                const reqLabel = '需≥' + (node.reqValue || 0);
                const labelY = cy + r + 12;
                ctx.fillStyle = (node.state === 'correct' || node.state === 'unlocked') ? '#555' : '#888';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(reqLabel, cx, labelY);
                ctx.restore();
            }

            function hitTest(pos, map) {
                if (!map || !map.nodeMap) return null;
                const vis = Object.values(map.nodeMap).filter(n => n.state !== 'hidden');
                for (const n of vis) {
                    if (n._checkBounds && pos.x >= n._checkBounds.x && pos.x <= n._checkBounds.x + n._checkBounds.w &&
                        pos.y >= n._checkBounds.y && pos.y <= n._checkBounds.y + n._checkBounds.h) {
                        return { node: n, target: 'check' };
                    }
                }
                for (const n of vis) {
                    if (n._bounds) {
                        if (pos.x >= n._bounds.x && pos.x <= n._bounds.x + n._bounds.w && pos.y >= n._bounds.y && pos.y <=
                            n._bounds.y + n._bounds.h) {
                            if (n.state === 'unlocked' && canCheck(n, map)) return { node: n, target: 'check' };
                            if (n.state === 'visible_locked' && canUnlock(n, map)) return { node: n, target: 'node' };
                            return null;
                        }
                    } else {
                        const r = (n.type === 'important' ? 22 : 20) + 3;
                        if (Math.hypot(pos.x - n.x, pos.y - n.y) <= r) {
                            if (n.state === 'unlocked' && canCheck(n, map)) return { node: n, target: 'check' };
                            if (n.state === 'visible_locked' && canUnlock(n, map)) return { node: n, target: 'node' };
                            return null;
                        }
                    }
                }
                return null;
            }

            canvas.addEventListener('click', e => {
                if (!gameStarted) return;
                const map = getActiveMap();
                if (!map || map.gameOver) return;
                if (tutorialActive && tutorialPhase === 'dig') return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = LOGICAL_WIDTH / canvas.clientWidth;
                const scaleY = LOGICAL_HEIGHT / canvas.clientHeight;
                const hit = hitTest({
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                }, map);
                if (!hit) return;
                if (hit.target === 'check' && canCheck(hit.node, map)) performCheck(hit.node, map);
                else if (hit.target === 'node' && canUnlock(hit.node, map)) unlockNode(hit.node, map);
            });

            canvas.addEventListener('mousemove', e => {
                if (!gameStarted) {
                    canvas.style.cursor = 'default';
                    return;

                const map = getActiveMap();
                if (!map || map.gameOver) {
                    canvas.style.cursor = 'default';
                    return;
                }
                const rect = canvas.getBoundingClientRect();
                const scaleX = LOGICAL_WIDTH / canvas.clientWidth;
                const scaleY = LOGICAL_HEIGHT / canvas.clientHeight;
                const hit = hitTest({
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                }, map);
                canvas.style.cursor = (hit && ((hit.target === 'check' && canCheck(hit.node, map)) || (hit.target ===
                    'node' && canUnlock(hit.node, map)))) ? 'pointer' : 'default';

            function resizeCanvas() {
                const wrapper = canvas.parentElement;
                if (!wrapper) return;
                const scale = Math.min(1, wrapper.clientWidth / LOGICAL_WIDTH);
                canvas.style.width = (LOGICAL_WIDTH * scale) + 'px';

            function getDigNeighbors(r, c) {
                const dirs = [
                    [-1, 0],
                    [1, 0],
                    [0, -1],
                    [0, 1]
                ];
                const result = [];
                for (const [dr, dc] of dirs) {
                    const nr = r + dr;
                    const nc = c + dc;
                    if (nr >= 0 && nr < DIG_ROWS && nc >= 0 && nc < DIG_COLS) result.push({ r: nr, c: nc });
                }
                return result;
            }

            function initTutorialDigGrid() {
                digGridCells = [];
                digGridRevealed = [];
                digCellStructureMap = [];
                digStructureGroups = [];
                tutorialDigOtherStructRevealed = {};
                for (let r = 0; r < DIG_ROWS; r++) {
                    digGridCells[r] = [];
                    digGridRevealed[r] = [];
                    digCellStructureMap[r] = [];
                    for (let c = 0; c < DIG_COLS; c++) {
                        digGridCells[r][c] = 'empty';
                        digGridRevealed[r][c] = false;
                        digCellStructureMap[r][c] = -1;
                    }
                }
                // 时间扩展结构 (3格) - 紧邻起点
                const teCells = [{ r: 0, c: 1 }, { r: 1, c: 0 }, { r: 1, c: 1 }];
                let structIdx = 0;
                digStructureGroups.push({
                    id: structIdx,
                    type: 'time_extend',
                    name: '⏰时间扩展',
                    cells: teCells,
                    allRevealed: false,
                    effectApplied: false
                });
                teCells.forEach(cell => {
                    digGridCells[cell.r][cell.c] = 'time_extend';
                    digCellStructureMap[cell.r][cell.c] = structIdx;
                });
                // 思维块结构 (4格) - 在时间扩展右侧
                structIdx++;
                const mbCells = [{ r: 0, c: 3 }, { r: 0, c: 4 }, { r: 1, c: 3 }, { r: 1, c: 4 }];
